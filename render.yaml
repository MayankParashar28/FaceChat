services:
  - type: web
    name: facecall-ai
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Allowed browser origin(s) for CORS / Socket.io, e.g. https://facecall-ai.onrender.com
      - key: CORS_ORIGIN
        sync: false
      # --- Client (Vite) build-time vars ---
      # Vite inlines these into the bundle during `npm run build`, so they MUST
      # be set here. Missing values ship an app that fails to start in the browser.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      # TURN relay for WebRTC (without it, calls fail behind symmetric NAT)
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
      # Redis for caching and rate limiting. Leave unset to use the in-process
      # fallback. Render Key Value sits in the same region as this service, so
      # it is the lowest-latency option.
      - key: REDIS_URL
        sync: false
      # Cloudinary for chat attachments. Leave unset to fall back to GridFS
      # (stores files in MongoDB and streams them through this service).
      # Set either CLOUDINARY_URL on its own, or the three parts below.
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
